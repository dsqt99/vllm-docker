services:
  qwen:
    image: vllm/vllm-openai:nightly
    container_name: qwen
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    shm_size: '16g'
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      - NVIDIA_VISIBLE_DEVICES=${GPU_DEVICES:-GPU-457b0f54-0926-45b5-56f0-103cb0feacbc,GPU-6afb412f-80fa-fc33-b672-2a6770592f1f}
      - NCCL_P2P_DISABLE=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    command: >
      --model ${MODEL_ID}
      --served-model-name ${MODEL_ID}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.92}
      --max-model-len ${MAX_MODEL_LEN:-262144}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-2}
      --kv-cache-dtype fp8
      --max-num-seqs ${MAX_NUM_SEQS:-4}
      --enable-prefix-caching
      --host 0.0.0.0
      --port 8000
      --mm-encoder-tp-mode data
      --mm-processor-cache-type shm
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --logprobs-mode raw_logprobs
    volumes:
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - vllm_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${MAIN_GPU_0:-GPU-457b0f54-0926-45b5-56f0-103cb0feacbc}'
                - '${MAIN_GPU_1:-GPU-6afb412f-80fa-fc33-b672-2a6770592f1f}'
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  hunyuan-ocr:
    profiles: ["ocr-hunyuan"]
    image: vllm-ocr:latest
    container_name: hunyuan-ocr
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    shm_size: '8g'
    ports:
      - "8003:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      - NVIDIA_VISIBLE_DEVICES=${HUNYUAN_GPU_DEVICES:-${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}}
    command: >
      --model tencent/HunyuanOCR
      --served-model-name tencent/HunyuanOCR
      --gpu-memory-utilization 0.16
      --max-model-len 4096
      --tensor-parallel-size 1
      --enforce-eager
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - vllm_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}'
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  senocr-vi:
    image: vllm/vllm-openai:nightly
    container_name: senocr-vi
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    shm_size: '8g'
    ports:
      - "${SENOCR_PORT:-8007}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      - NVIDIA_VISIBLE_DEVICES=${SENOCR_GPU_DEVICES:-${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}}
    command: >
      --model ${SENOCR_MODEL_ID:-VietAlphaLabs/SenOCR-Vi}
      --served-model-name ${SENOCR_MODEL_ID:-VietAlphaLabs/SenOCR-Vi} senocr-vi
      --trust-remote-code
      --gpu-memory-utilization ${SENOCR_GPU_MEMORY_UTILIZATION:-0.25}
      --max-model-len ${SENOCR_MAX_MODEL_LEN:-4096}
      --kv-cache-dtype fp8
      --tensor-parallel-size 1
      --enforce-eager
      --no-enable-prefix-caching
      --mm-processor-cache-gb 0
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - vllm_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}'
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qwen-embedding:
    image: vllm/vllm-openai:nightly
    container_name: qwen-embedding
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    shm_size: '4g'
    ports:
      - "8004:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      - NVIDIA_VISIBLE_DEVICES=${EMBEDDING_GPU_DEVICES:-${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}}
    command: >
      --model Qwen/Qwen3-Embedding-0.6B
      --served-model-name Qwen/Qwen3-Embedding-0.6B
      --runner pooling
      --gpu-memory-utilization 0.10
      --max-model-len 8192
      --tensor-parallel-size 1
      --enforce-eager
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - vllm_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}'
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bge-reranker:
    image: vllm/vllm-openai:nightly
    container_name: bge-reranker
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    shm_size: '4g'
    ports:
      - "8005:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      - NVIDIA_VISIBLE_DEVICES=${RERANKER_GPU_DEVICES:-${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}}
    command: >
      --model BAAI/bge-reranker-v2-m3
      --served-model-name BAAI/bge-reranker-v2-m3
      --runner pooling
      --gpu-memory-utilization 0.08
      --max-model-len 8192
      --tensor-parallel-size 1
      --enforce-eager
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - vllm_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}'
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  decision-qwen:
    image: vllm/vllm-openai:nightly
    container_name: decision-qwen
    runtime: nvidia
    restart: unless-stopped
    ipc: host
    shm_size: '8g'
    ports:
      - "${DECISION_PORT:-8006}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - TRANSFORMERS_OFFLINE=${HF_HUB_OFFLINE:-1}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - NVIDIA_VISIBLE_DEVICES=${DECISION_GPU_DEVICES:-${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}}
    command: >
      --model ${DECISION_MODEL_ID:-mssfj/Qwen3.5-9B-GPTQ-INT4}
      --served-model-name ${DECISION_MODEL_ID:-mssfj/Qwen3.5-9B-GPTQ-INT4} Qwen/Qwen3.5-9B qwen-decision decision-qwen
      --gpu-memory-utilization ${DECISION_GPU_MEMORY_UTILIZATION:-0.37}
      --max-model-len ${DECISION_MAX_MODEL_LEN:-8192}
      --kv-cache-dtype fp8
      --enforce-eager
      --tensor-parallel-size 1
      --enable-prefix-caching
      --logprobs-mode raw_logprobs
      --host 0.0.0.0
      --port 8000
    volumes:
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
      - ./patch_strategies.py:/usr/local/lib/python3.12/dist-packages/vllm/entrypoints/openai/decisions/strategies.py:ro
    networks:
      - vllm_default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - '${AUX_GPU_0:-GPU-52ffc732-f2b1-3313-e814-31f49a8dadc3}'
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: vllm-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ./litellm_logger.py:/app/litellm_logger.py
      - ./logs:/app/logs
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - AUDIT_LOG_FILE=/app/logs/audit.log
    command: [ "--config", "/app/config.yaml", "--port", "4000", "--detailed_debug" ]
    networks:
      - vllm_default
    depends_on:
      - qwen

  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    container_name: vllm-manager
    restart: unless-stopped
    ports:
      - "${MANAGER_PORT:-8050}:8050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/libexec/docker/cli-plugins:/usr/local/lib/docker/cli-plugins:ro
      - ${HF_CACHE_DIR:-/home/cahy/.cache/huggingface}:/root/.cache/huggingface
      - ./litellm_config.yaml:/app/litellm_config.yaml
      - ./.env:/app/.env
      - ./docker-compose.yml:/app/docker-compose.yml
      - ./manager/main.py:/app/main.py
      - ./manager/static:/app/static
      - ./logs:/app/logs
    environment:
      - VLLM_MANAGER_API_KEY=${VLLM_MANAGER_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - VLLM_API_BASE=${VLLM_API_BASE:-http://qwen:8000}
      - LITELLM_API_BASE=${LITELLM_API_BASE:-http://vllm-litellm:4000}
      - MANAGER_PORT=${MANAGER_PORT:-8050}
      - PRIMARY_CONTAINER=${PRIMARY_CONTAINER:-qwen}
      - AUDIT_LOG_FILE=/app/logs/audit.log
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - vllm_default
    depends_on:
      - qwen
      - litellm

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vllm-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9095}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - vllm_default

  grafana:
    image: grafana/grafana:10.4.0
    container_name: vllm-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3050}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/vllm-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards/json:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - vllm_default
    depends_on:
      - prometheus

networks:
  vllm_default:

volumes:
  prometheus_data:
  grafana_data: